services:
  api:
    container_name: fincherry-api
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: api
    restart: unless-stopped
    user: "1000:1000"  # match host sam (UID 1000) + node user in container
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://fincherry:${DB_PASSWORD}@infra-db:5432/fincherry
      JWT_SECRET: ${JWT_SECRET}
      AUTH_PASSPHRASE_HASH: ${AUTH_PASSPHRASE_HASH}
      PARTNER_PASSPHRASE_HASH: ${PARTNER_PASSPHRASE_HASH:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_INSIGHTS_MODEL: ${GEMINI_INSIGHTS_MODEL:-gemini-2.5-flash}
      GEMINI_CATEGORIZATION_MODEL: ${GEMINI_CATEGORIZATION_MODEL:-gemini-2.5-flash}
    volumes:
      - uploads:/app/apps/api/uploads
    networks:
      - infra-net

  web-assets:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: web-build
    profiles: [tools]
    volumes:
      - fincherry_web:/output
    entrypoint: ["/bin/sh", "-c", "rm -rf /output/* && cp -r /app/apps/web/dist/* /output/"]
    networks:
      - infra-net

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: migrate
    profiles: [tools]
    environment:
      DATABASE_URL: postgresql://fincherry:${DB_PASSWORD}@infra-db:5432/fincherry
    networks:
      - infra-net

volumes:
  uploads:
  fincherry_web:
    external: true

networks:
  infra-net:
    external: true
