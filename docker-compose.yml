services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fincherry
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-strong-password}
      POSTGRES_DB: fincherry
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincherry"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://fincherry:${DB_PASSWORD:-change-me-strong-password}@db:5432/fincherry
      JWT_SECRET: ${JWT_SECRET:-}
      AUTH_PASSPHRASE_HASH: ${AUTH_PASSPHRASE_HASH:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_INSIGHTS_MODEL: ${GEMINI_INSIGHTS_MODEL:-gemini-2.0-flash}
      GEMINI_CATEGORIZATION_MODEL: ${GEMINI_CATEGORIZATION_MODEL:-gemini-2.0-flash}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - internal

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pg_data:
  uploads:
  backups:
  certbot_conf:
  certbot_www:

networks:
  internal:
